<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Wolf</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <div id="score">SCORE: <span id="score-value">0</span></div>
            <div id="title">SEA WOLF</div>
            <div id="time">TIME: <span id="time-value">60</span></div>
        </div>
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <div id="touch-zones">
                <div id="touch-left" class="touch-zone">
                    <div class="zone-icon"></div>
                    <span class="zone-label">Left</span>
                </div>
                <div id="touch-right" class="touch-zone">
                    <div class="zone-icon"></div>
                    <span class="zone-label">Right</span>
                </div>
                <div id="touch-fire" class="touch-zone">
                    <div class="zone-icon"></div>
                    <span class="zone-label">Fire</span>
                </div>
            </div>
        </div>
        <div id="controls">
            <p class="desktop-controls">MOVE: Arrow Keys or Mouse | FIRE: Spacebar or Click</p>
            <p class="mobile-controls">LEFT/RIGHT zones to move | RIGHT zone to fire</p>
        </div>
        <div id="start-screen">
            <h1>SEA WOLF</h1>
            <p>Sink the enemy ships before time runs out!</p>
            <button id="start-btn">START GAME</button>
        </div>
        <div id="game-over" class="hidden">
            <h1>GAME OVER</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
